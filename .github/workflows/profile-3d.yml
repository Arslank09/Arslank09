name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # every day at 18:00 UTC (11 PM Pakistan time)
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # To include PRIVATE contributions, create a token and save it as a repo secret named
          # PROFILE_3D_TOKEN, then it is used automatically. Otherwise the default token (public only) is used.
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3D contribution graph" || { echo "no changes"; exit 0; }
          git pull --rebase -X theirs origin main
          git push
